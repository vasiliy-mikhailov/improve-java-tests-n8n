services:
  improve-java-tests-spring:
    build: .
    image: improve-java-tests-spring:latest
    container_name: ijtspring
    # A reaper. PIT and Surefire fork JVMs; Exec kills the whole process group, and the
    # dead children are then reparented to PID 1 — which reaps them only if it knows to.
    # Measured on the live box after 3 hours: 5 <defunct> java processes and climbing. They
    # cost no CPU or memory, just PID-table entries, so this leaks slowly rather than
    # breaking loudly. It gets worse once n8n goes and the JVM itself is PID 1: a JVM does
    # not reap children it did not spawn.
    init: true
    restart: unless-stopped
    env_file: .env
    volumes:
      - ijt_data:/data
    networks:
      - proxy-net
      - mvn-cache
    # no host ports: Caddy (inference-caddy, same proxy-net) fronts everything at
    # https://improve-java-tests-spring.mikhailov.tech (n8n) and /dashboard (sidecar)

volumes:
  ijt_data:
    # PINNED, and not decoration. Compose derives its project name from the directory, so
    # the volume is normally <dir>_ijt_data — and renaming the checkout from
    # improve-java-tests-n8n to -spring would therefore have pointed the container at a
    # brand-new empty volume, silently orphaning 807 MB: the improvedLedger and
    # measureLedger, every prepared PR patch, the cloned repos and the whole run history.
    # Nothing would have errored; the next run would simply have started from zero and
    # re-improved files that already have open PRs.
    #
    # An explicit name makes the volume independent of what the directory is called, so the
    # next rename is free.
    name: ijt_data

networks:
  proxy-net:
    external: true
  # the host's Nexus group repo lives here — Maven/Gradle resolve through it
  mvn-cache:
    external: true
