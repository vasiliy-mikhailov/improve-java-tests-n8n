# Run improve-java-tests-spring anywhere: a laptop, a CI box, any host that is not the
# deployment server.
#
# Why this is a SEPARATE file and not an override of docker-compose.yml: the deployed
# compose joins two `external: true` networks (proxy-net for Caddy, mvn-cache for Nexus)
# and publishes no host ports, because Caddy fronts everything. Neither network exists
# elsewhere, so `docker compose up` fails before it starts a container — and a service's
# `networks:` list cannot be reliably emptied by an override. A standalone file has no
# merge semantics to get wrong and cannot accidentally inherit the deployment's topology.
#
# Usage:
#   cp .env.example .env      # then edit the keys listed in README "Run it anywhere"
#   docker compose -f docker-compose.local.yml up -d --build
#
# Everything else — the volume name, the container name, the image tag — matches the
# deployment, so `docker exec ijtspring ...` in the README and eval docs works unchanged.

services:
  improve-java-tests-spring:
    build: .
    image: improve-java-tests-spring:latest
    container_name: ijtspring
    # A reaper. PIT and Surefire fork JVMs; Exec kills the whole process group, and the
    # dead children are then reparented to PID 1 — which reaps them only if it knows to.
    # Measured on the live box after 3 hours: 5 <defunct> java processes and climbing. They
    # cost no CPU or memory, just PID-table entries, so this leaks slowly rather than
    # breaking loudly. It gets worse once n8n goes and the JVM itself is PID 1: a JVM does
    # not reap children it did not spawn.
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      # host:container. The container side follows SIDECAR_PORT because that is what the
      # orchestrator binds; the host side is separate so you can move a port that is already
      # taken on your machine without changing what the app listens on.
      #
      # One port now. n8n's 5678 is gone with n8n — the orchestrator serves the dashboard,
      # the API and the run webhook on this one.
      - "${HOST_DASHBOARD_PORT:-3000}:${SIDECAR_PORT:-3000}"
    volumes:
      - ijt_data:/data
    # A PIT run forks a JVM per mutant on top of Maven/Gradle and n8n. Docker Desktop's
    # default memory allowance is where laptop runs usually die first — if builds fail
    # with exit 137 (OOM-killed), raise Docker's memory limit before suspecting the repo.

volumes:
  ijt_data:
    # PINNED, and not decoration. Compose derives its project name from the directory, so
    # the volume is normally <dir>_ijt_data — and renaming the checkout from
    # improve-java-tests-n8n to -spring would therefore have pointed the container at a
    # brand-new empty volume, silently orphaning 807 MB: the improvedLedger and
    # measureLedger, every prepared PR patch, the cloned repos and the whole run history.
    # Nothing would have errored; the next run would simply have started from zero and
    # re-improved files that already have open PRs.
    #
    # An explicit name makes the volume independent of what the directory is called, so the
    # next rename is free.
    name: ijt_data
